<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>filter.fyi — how it works</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --paper: #e9e4d9;
    --canvas: #f4f1e9;
    --card: #fbfaf5;
    --ink: #25231d;
    --ink-2: #56524a;
    --dim: #a39c8e;
    --line: rgba(37,35,29,0.16);
    --ok: oklch(0.62 0.13 150);
    --warn: oklch(0.72 0.13 72);
    --flow: oklch(0.52 0.20 282);
    --cost: oklch(0.64 0.16 64);
    --w: oklch(0.58 0.12 152);
    --r: oklch(0.58 0.12 248);
    --hue-edge: 248;
    --hue-fly: 152;
    --hue-ext: 28;
    font-family: "IBM Plex Sans", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--paper); color: var(--ink); }
  #root { height: 100%; }
  .mono { font-family: "JetBrains Mono", monospace; }
  button { font-family: inherit; cursor: pointer; }

  .app { display: grid; grid-template-columns: 272px 1fr 372px; height: 100vh; overflow: hidden; }

  /* ----------------------------------------------------------- rail --- */
  .rail { display: flex; flex-direction: column; background: var(--card);
    border-right: 1px solid var(--line); min-height: 0; }
  .rail-head { padding: 18px 18px 12px; border-bottom: 1px solid var(--line); }
  .brand { font-weight: 700; font-size: 20px; letter-spacing: -0.02em; }
  .brand-dot { color: var(--flow); }
  .brand-sub { font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--dim);
    margin-top: 3px; letter-spacing: 0.02em; }

  .flowbtn { display: flex; align-items: center; gap: 8px; width: calc(100% - 24px);
    margin: 4px 12px 0; padding: 8px 10px; background: transparent; border: 1px solid transparent;
    border-radius: 7px; text-align: left; color: var(--ink); transition: background .12s, border-color .12s; }
  .flowbtn:hover { background: rgba(37,35,29,0.04); }
  .flowbtn.is-active { background: color-mix(in oklab, var(--flow) 12%, transparent);
    border-color: color-mix(in oklab, var(--flow) 40%, transparent); }
  .flowbtn.topo { margin-top: 12px; border: 1px dashed var(--line); }
  .flowbtn-t { font-size: 12.5px; font-weight: 500; flex: 1; line-height: 1.2; }
  .flowbtn-s { font-size: 10px; color: var(--dim); }
  .flowbtn.topo { flex-direction: column; align-items: flex-start; gap: 3px; }
  .flowbtn.topo .flowbtn-t { flex: none; white-space: nowrap; }
  .flowbtn-s { line-height: 1.3; }
  .flowbtn-n { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--dim);
    background: rgba(37,35,29,0.05); border-radius: 4px; padding: 1px 5px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; flex: 0 0 auto; }

  .rail-scroll { flex: 1; overflow-y: auto; padding-bottom: 8px; min-height: 0; }
  .rail-group { margin-top: 12px; }
  .rail-group-h { font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: 0.1em;
    text-transform: uppercase; color: var(--dim); padding: 0 18px; margin-bottom: 2px; }

  .rail-foot { border-top: 1px solid var(--line); padding: 12px 16px; display: flex; flex-direction: column; gap: 9px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--ink-2); cursor: pointer; }
  .toggle input { accent-color: var(--cost); width: 14px; height: 14px; }
  .fitbtn { align-self: flex-start; font-size: 11px; font-family: "JetBrains Mono", monospace; white-space: nowrap;
    background: rgba(37,35,29,0.04); border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; color: var(--ink-2); }
  .toggle span { line-height: 1.25; }
  .fitbtn:hover { background: rgba(37,35,29,0.08); }
  .legend { display: flex; flex-direction: column; gap: 5px; }
  .legend-row { display: flex; gap: 12px; }
  .lg { display: flex; align-items: center; gap: 5px; font-size: 10.5px; color: var(--ink-2); }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; }
  .sw-w { background: color-mix(in oklab, var(--w) 30%, white); border: 1px solid var(--w); }
  .sw-r { background: color-mix(in oklab, var(--r) 30%, white); border: 1px solid var(--r); }
  .sw-cost { background: color-mix(in oklab, var(--cost) 30%, white); border: 1px solid var(--cost); }
  .coverage { font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--dim); }

  /* ----------------------------------------------------------- stage -- */
  .stage-col { position: relative; background:
      radial-gradient(circle at 1px 1px, rgba(37,35,29,0.06) 1px, transparent 0) 0 0 / 26px 26px,
      var(--canvas);
    overflow: hidden; min-width: 0; }
  .map-wrap { position: absolute; inset: 0; cursor: grab; overflow: hidden; }
  .map-wrap:active { cursor: grabbing; }
  .map-stage { position: absolute; top: 0; left: 0; transform-origin: 0 0; }
  /* only the button-driven zoom animates; wheel/pan stay 1:1 so they feel live */
  .map-stage.is-anim { transition: transform .16s cubic-bezier(.22,.61,.36,1); }

  .map-zoom { position: absolute; right: 12px; bottom: 12px; z-index: 5;
    display: flex; flex-direction: column; gap: 6px; }
  .map-zoom button { width: 30px; height: 30px; display: flex; align-items: center; justify-content: center;
    font-family: "JetBrains Mono", monospace; font-size: 16px; line-height: 1; color: var(--ink-2);
    background: color-mix(in oklab, var(--card) 86%, transparent); border: 1px solid var(--line);
    border-radius: 8px; backdrop-filter: blur(4px); transition: background .12s, color .12s; }
  .map-zoom button:hover { background: var(--card); color: var(--ink); }
  .map-zoom .zfit { font-size: 12px; }
  .edge-svg { position: absolute; top: 0; left: 0; overflow: visible; }
  .node-layer { position: absolute; top: 0; left: 0; }
  .zone-label { font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 600; letter-spacing: 0.06em; }

  .hint { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%);
    display: flex; gap: 14px; font-family: "JetBrains Mono", monospace; font-size: 10px; color: var(--dim);
    background: color-mix(in oklab, var(--canvas) 80%, transparent); padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--line); backdrop-filter: blur(4px); pointer-events: none; }

  /* ----------------------------------------------------------- nodes -- */
  .node { position: absolute; display: flex; align-items: stretch; background: var(--card);
    border: 1px solid color-mix(in oklab, oklch(0.5 0.1 var(--zh)) 36%, var(--line));
    border-radius: 8px; overflow: hidden; cursor: pointer; box-shadow: 0 1px 0 rgba(37,35,29,0.05);
    transition: opacity .18s, box-shadow .15s, transform .1s; }
  .node:hover { box-shadow: 0 3px 12px rgba(37,35,29,0.13); }
  .node-bar { width: 3px; flex: 0 0 auto; background: oklch(0.55 0.12 var(--zh)); }
  .node-body { padding: 6px 9px; display: flex; flex-direction: column; justify-content: center; min-width: 0; flex: 1; }
  .node-title { font-size: 12.5px; font-weight: 600; line-height: 1.15; letter-spacing: -0.01em;
    display: flex; align-items: center; gap: 5px; }
  .node-dollar { color: var(--cost); font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 12px; }
  .node-tag { font-family: "JetBrains Mono", monospace; font-size: 9.5px; color: var(--dim); margin-top: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node--actor { background: #faf7ee; border-style: solid; }
  .node--actor .node-bar { background: var(--ink); }
  .node--clock .node-bar { background: var(--warn); }
  .node--external.is-cost .node-bar, .node.is-cost .node-bar { background: var(--cost); }
  .node--datastore { flex-direction: column; align-items: stretch; }
  .node--datastore .node-bar { width: 100%; height: 3px; }
  .node--datastore .node-body { flex: 0 0 auto; }

  .node-tables { display: flex; flex-wrap: wrap; gap: 3px; padding: 0 8px 8px; align-content: flex-start; overflow: hidden; }
  .tchip { font-family: "JetBrains Mono", monospace; font-size: 9px; line-height: 1.4; padding: 1px 5px;
    background: rgba(37,35,29,0.05); border: 1px solid var(--line); border-radius: 4px; color: var(--ink-2); }
  .tchip--w { background: color-mix(in oklab, var(--w) 22%, white); border-color: var(--w); color: oklch(0.4 0.1 152); }
  .tchip--r { background: color-mix(in oklab, var(--r) 20%, white); border-color: var(--r); color: oklch(0.4 0.1 248); }
  .tchip--dead { text-decoration: line-through; opacity: 0.5; }

  .node.is-on { box-shadow: 0 0 0 2px color-mix(in oklab, var(--flow) 55%, transparent), 0 4px 14px rgba(37,35,29,0.12); z-index: 3; }
  .node.is-off { opacity: 0.18; filter: grayscale(0.5); }
  .node.is-cost { box-shadow: 0 0 0 2.5px color-mix(in oklab, var(--cost) 70%, transparent);
    background: color-mix(in oklab, var(--cost) 9%, var(--card)); border-color: var(--cost); }
  .node.is-on.is-cost { box-shadow: 0 0 0 2px color-mix(in oklab, var(--cost) 65%, transparent), 0 4px 14px rgba(37,35,29,0.12); }
  .node.is-sel { box-shadow: 0 0 0 2px var(--ink), 0 4px 14px rgba(37,35,29,0.18); z-index: 4; }
  .node.is-hover { transform: translateY(-1px); }

  .edge-label { position: absolute; transform: translate(-50%, -50%); display: flex; align-items: center; gap: 6px;
    max-width: 250px; background: var(--card); border: 1px solid color-mix(in oklab, var(--flow) 45%, var(--line));
    border-radius: 7px; padding: 4px 9px 4px 4px; font-size: 11px; line-height: 1.2; color: var(--ink);
    box-shadow: 0 4px 14px rgba(37,35,29,0.16); pointer-events: none; z-index: 5; }
  .edge-num { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; color: white;
    background: var(--flow); width: 17px; height: 17px; border-radius: 5px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }

  /* ---------------------------------------------------------- drawer -- */
  .rail { z-index: 2; }
  .app > :last-child { background: var(--card); border-left: 1px solid var(--line); overflow-y: auto; }
  .drawer { padding: 20px 20px 40px; display: flex; flex-direction: column; min-height: 0; }
  .drawer-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .x { font-size: 11px; font-family: "JetBrains Mono", monospace; color: var(--ink-2); background: rgba(37,35,29,0.04);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
  .x:hover { background: rgba(37,35,29,0.08); }
  .pill { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 600; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--pc); border: 1px solid color-mix(in oklab, var(--pc) 45%, transparent);
    background: color-mix(in oklab, var(--pc) 12%, transparent); border-radius: 20px; padding: 3px 10px; }
  .drawer-title { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; margin: 0 0 2px; line-height: 1.15; }
  .drawer-group { font-family: "JetBrains Mono", monospace; font-size: 10.5px; color: var(--dim); margin-bottom: 12px; }
  .drawer-group.mono { color: var(--ink-2); }
  .blurb { font-size: 13px; line-height: 1.5; color: var(--ink-2); margin: 0 0 16px; }

  .aggs { display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; }
  .agg-h { font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--dim); margin-bottom: 5px; }
  .agg-h--cost { color: var(--cost); }
  .agg-h--w { color: var(--w); }
  .agg-h--r { color: var(--r); }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; }
  .chip { font-family: "JetBrains Mono", monospace; font-size: 10.5px; padding: 3px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: rgba(37,35,29,0.04); color: var(--ink-2); display: inline-flex; align-items: center; gap: 5px; }
  .chip--cost { color: oklch(0.46 0.13 64); border-color: color-mix(in oklab, var(--cost) 45%, transparent); background: color-mix(in oklab, var(--cost) 12%, transparent); }
  .chip--w { color: oklch(0.4 0.1 152); border-color: var(--w); background: color-mix(in oklab, var(--w) 14%, transparent); }
  .chip--r { color: oklch(0.4 0.1 248); border-color: var(--r); background: color-mix(in oklab, var(--r) 14%, transparent); }
  .chip--flow { cursor: pointer; }
  .chip--flow:hover { background: rgba(37,35,29,0.09); }

  .controls { display: flex; align-items: center; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line);
    border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .controls button { width: 34px; height: 30px; border: 1px solid var(--line); background: var(--card);
    border-radius: 6px; font-size: 12px; color: var(--ink); display: flex; align-items: center; justify-content: center; }
  .controls button:hover:not(:disabled) { background: rgba(37,35,29,0.06); }
  .controls button:disabled { opacity: 0.35; cursor: default; }
  .controls .play { width: auto; padding: 0 12px; font-family: "JetBrains Mono", monospace; font-size: 11px; font-weight: 600;
    background: var(--flow); color: white; border-color: var(--flow); }
  .controls .counter { margin-left: auto; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--dim); }

  .steps { display: flex; flex-direction: column; gap: 5px; overflow-y: auto; }
  .step { display: flex; gap: 9px; text-align: left; padding: 8px 9px; border: 1px solid var(--line);
    border-radius: 7px; background: var(--card); transition: background .12s, border-color .12s, opacity .12s; }
  .step:hover { background: rgba(37,35,29,0.03); }
  .step.is-done { opacity: 0.55; }
  .step.is-cur { border-color: color-mix(in oklab, var(--flow) 55%, transparent);
    background: color-mix(in oklab, var(--flow) 8%, transparent); opacity: 1; }
  .step-n { font-family: "JetBrains Mono", monospace; font-size: 10px; font-weight: 700; color: var(--ink-2);
    background: rgba(37,35,29,0.07); border-radius: 5px; width: 18px; height: 18px; flex: 0 0 auto;
    display: flex; align-items: center; justify-content: center; margin-top: 1px; }
  .step.is-cur .step-n { background: var(--flow); color: white; }
  .step-body { min-width: 0; flex: 1; }
  .step-route { font-family: "JetBrains Mono", monospace; font-size: 9.5px; color: var(--dim); margin-bottom: 2px; }
  .step-route .arr { color: var(--flow); }
  .step-label { font-size: 12px; line-height: 1.35; color: var(--ink); }
  .step-note { font-size: 11px; line-height: 1.4; color: var(--ink-2); margin-top: 3px; font-style: italic; }
  .step-badges { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
  .b { font-family: "JetBrains Mono", monospace; font-size: 9px; padding: 1px 5px; border-radius: 4px; border: 1px solid var(--line); }
  .b--cost { color: oklch(0.46 0.13 64); border-color: color-mix(in oklab, var(--cost) 45%, transparent); background: color-mix(in oklab, var(--cost) 12%, transparent); }
  .b--w { color: oklch(0.4 0.1 152); border-color: var(--w); background: color-mix(in oklab, var(--w) 13%, transparent); }
  .b--r { color: oklch(0.4 0.1 248); border-color: var(--r); background: color-mix(in oklab, var(--r) 13%, transparent); }

  .specs { margin: 0 0 16px; padding-left: 16px; display: flex; flex-direction: column; gap: 5px; }
  .specs li { font-size: 12px; line-height: 1.4; color: var(--ink-2); }
  .tables-h { font-family: "JetBrains Mono", monospace; font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--dim); margin: 6px 0 7px; }
  .tables { margin-bottom: 14px; }
  .trow { padding: 8px 0; border-top: 1px solid var(--line); }
  .trow-name { font-family: "JetBrains Mono", monospace; font-size: 12px; font-weight: 600; display: flex; align-items: center; gap: 7px; }
  .trow--dead .trow-name { text-decoration: line-through; opacity: 0.55; }
  .dead-tag { font-size: 8.5px; text-decoration: none; color: var(--warn); border: 1px solid var(--warn); border-radius: 4px; padding: 0 4px; }
  .trow-note { font-size: 11px; color: var(--ink-2); margin-top: 2px; }
  .trow-flows { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 6px; }
  .miniflow { font-family: "JetBrains Mono", monospace; font-size: 9.5px; padding: 2px 6px; border-radius: 5px;
    border: 1px solid var(--line); background: var(--card); color: var(--ink-2); }
  .miniflow--w { border-color: var(--w); color: oklch(0.42 0.1 152); }
  .miniflow--r { border-color: var(--r); color: oklch(0.42 0.1 248); }
  .miniflow:hover { background: rgba(37,35,29,0.06); }
  .node-flows { margin-top: 4px; }

  .howto { margin: 0 0 18px; padding-left: 16px; display: flex; flex-direction: column; gap: 7px; }
  .howto li { font-size: 12.5px; line-height: 1.45; color: var(--ink-2); }
  .howto .sw { vertical-align: -1px; margin: 0 1px; }
  .intro-note { margin-top: 18px; font-size: 11px; line-height: 1.5; color: var(--dim); border-top: 1px solid var(--line); padding-top: 12px; }

  @media (max-width: 1180px) {
    .app { grid-template-columns: 240px 1fr 320px; }
  }
</style>
</head>
<body>
  <div id="root"></div>
  <!-- Self-hosted React + precompiled app. No CDN, no Babel, no eval. -->
  <script src="react.production.min.js"></script>
  <script src="react-dom.production.min.js"></script>
  <script src="data.js"></script>
  <script src="map.js"></script>
  <script src="panel.js"></script>
  <script src="app.js"></script>
</body>
</html>
